name: Phone OSINT Scanner

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: 'Número de telefone (formato internacional, ex: 5511999999999)'
        required: true
        type: string
      output_dir:
        description: 'Diretório de saída (padrão: data/results)'
        required: false
        type: string
        default: 'data/results'

  schedule:
    # Executa a cada 6 horas (exemplo)
    - cron: '0 */6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar scanner OSINT
        env:
          PHONE: ${{ github.event.inputs.phone_number || '5511999999999' }}
          OUTPUT_DIR: ${{ github.event.inputs.output_dir || 'data/results' }}
        run: |
          python roteiros/scanner.py "$PHONE" "$OUTPUT_DIR"

      - name: Upload dos resultados
        uses: actions/upload-artifact@v3
        with:
          name: osint-results-${{ github.run_id }}
          path: data/results/
