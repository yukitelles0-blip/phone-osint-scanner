name: Phone OSINT Scanner

on:
  workflow_dispatch:
    inputs:
      phone_number:
        description: 'Número de telefone (formato internacional, ex: 5511999999999)'
        required: true
        type: string

      output_dir:
        description: 'Diretório de saída (padrão: data/results)'
        required: false
        type: string
        default: 'data/results'

  schedule:
    # Executa a cada 6 horas
    - cron: '0 */6 * * *'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar scanner OSINT
        env:
          PHONE: ${{ github.event.inputs.phone_number || '5511999999999' }}
          OUTPUT_DIR: ${{ github.event.inputs.output_dir || 'data/results' }}
        run: |
        python scripts/scanner.py "$PHONE" "$OUTPUT_DIR"
      - name: Enviar resultados
        uses: actions/upload-artifact@v4
        with:
          name: osint-results-${{ github.run_id }}
          path: data/results/
